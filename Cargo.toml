[package]
# Ported from: ElevatorMod 1.21.1-1.11.4 (VsnGamer/ElevatorMod, MIT),
# Minecraft Java 1.21.1 NeoForge; clean-room rewrite for Horizon 26.3.
# Local-only until the maintainer approves publishing (ARCHITECTURE.md §8).
name = "horizon-elevatorid"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "ElevatorMod for Horizon: jump to ride an elevator column up, sneak to ride it down"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
